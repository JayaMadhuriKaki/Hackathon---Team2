# One command runs the whole stack:  docker compose up -d --build
#   frontend    http://localhost:3000   (nginx; proxies /api to backend)
#   backend     http://localhost:8080   (Spring Boot)
#   postgres    localhost:5433          (Postgres 18)
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3001
#   swagger-ui  http://localhost:8082   (API contract, "Try it out" calls the backend)
name: hackathon

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-hackathon}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-hackathon}
      # Flyway + demo seed run as the database owner; the app runs as a least-privilege role
      DB_OWNER_USERNAME: ${DB_USERNAME:-postgres}
      DB_OWNER_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USERNAME: ${DB_APP_USERNAME:-expenseflow_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:-expenseflow_app_dev}
      JWT_SECRET: ${JWT_SECRET:-}
      # Synthetic demo logins only (DATA-004); override in .env
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo-Only-2026!}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8082
      TZ: UTC
    volumes:
      - receipts:/data/receipts
      - exports:/data/exports
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # API docs: Swagger UI for the hand-written contract (CLAUDE.md §12), http://localhost:8082
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/api-contracts.yaml
    volumes:
      - ./architecture/api-contracts.yaml:/spec/api-contracts.yaml:ro
    ports:
      - "${SWAGGER_PORT:-8082}:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  grafanadata:
  receipts:
  exports:
