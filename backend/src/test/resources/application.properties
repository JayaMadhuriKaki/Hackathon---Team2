# Tests run on H2 without Docker. Flyway is off (its PostgreSQL-specific SQL is verified
# against the Docker stack); Hibernate creates the schema from the entities instead.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=test-secret-that-is-at-least-32-bytes-long!!
app.test-run=${random.uuid}
app.storage.receipts-dir=${java.io.tmpdir}/expenseflow-test/${app.test-run}/receipts
app.storage.exports-dir=${java.io.tmpdir}/expenseflow-test/${app.test-run}/exports
app.rate-limit.login-per-minute=1000
app.metrics.refresh-ms=600000
