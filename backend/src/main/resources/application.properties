spring.application.name=backend

# ---- Database (architecture/SPEC.md §6 DB roles, §15 env names) ----
# Runtime connection: the least-privilege app role created by migration V005.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hackathon}
spring.datasource.username=${DB_USERNAME:expenseflow_app}
spring.datasource.password=${DB_PASSWORD:expenseflow_app_dev}
# Flyway runs migrations with the owner credentials; placeholders create the app role (no secret in Git).
spring.flyway.user=${DB_OWNER_USERNAME:postgres}
spring.flyway.password=${DB_OWNER_PASSWORD:postgres}
spring.flyway.placeholders.app_user=${DB_USERNAME:expenseflow_app}
spring.flyway.placeholders.app_password=${DB_PASSWORD:expenseflow_app_dev}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- API conventions (architecture/SPEC.md §8) ----
# Unknown JSON fields are rejected (CLAUDE.md §11.1)
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---- Security (ADR-000 P-03, SPEC-Q-13 proposed defaults) ----
# JWT_SECRET must be at least 32 bytes. If unset, a random secret is generated at start-up
# (tokens then stop working after a restart) and a warning is logged.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MIN:5}
app.rate-limit.login-per-ip-per-minute=${RATE_LIMIT_LOGIN_PER_IP_PER_MIN:30}
app.rate-limit.upload-per-minute=${RATE_LIMIT_UPLOAD_PER_MIN:30}

# ---- Demo logins (synthetic, DATA-004): off unless SEED_DEMO_USERS=true ----
app.seed.demo-users=${SEED_DEMO_USERS:false}
app.seed.demo-password=${SEED_DEMO_PASSWORD:}

# ---- Receipts and payout files (SPEC-Q-06 proposed: PDF, JPEG, PNG up to 5 MB) ----
app.storage.receipts-dir=${RECEIPTS_DIR:./data/receipts}
app.storage.exports-dir=${EXPORTS_DIR:./data/exports}
app.receipts.max-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Every log line carries the request trace ID (CLAUDE.md §11.10)
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

# CORS fallback (frontend normally uses the proxy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Behind the nginx proxy: take the client IP from X-Forwarded-For (trusted private-network
# proxies only), so the per-IP login rate limit is per user, not shared by everyone.
server.forward-headers-strategy=native

# ---- Actuator and metrics (NFR-008) ----
# Separate port, not published by docker-compose: only Prometheus on the Compose network
# and the container healthcheck can reach /actuator (backend/SPEC.md §7.7).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.metrics.refresh-ms=${METRICS_REFRESH_MS:30000}
