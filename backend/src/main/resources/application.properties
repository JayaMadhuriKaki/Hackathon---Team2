spring.application.name=backend

# Database: defaults match docker-compose; override with env vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hackathon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA: creates/updates tables from @Entity classes (fine for a hackathon)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Errors use {code, message, details, traceId} from GlobalExceptionHandler (CLAUDE.md §11.4)
# Unknown JSON fields are rejected (CLAUDE.md §11.1)
spring.jackson.deserialization.fail-on-unknown-properties=true

# Every log line carries the request trace ID (CLAUDE.md §11.10)
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

# CORS fallback (frontend normally uses the proxy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator: /actuator/health and /actuator/prometheus (scraped by Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
