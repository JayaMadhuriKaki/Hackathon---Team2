  schemas:
    Money:
      type: string
      description: INR amount, exactly two decimals, no separators.
      pattern: '^\d+\.\d{2}$'
      example: '27450.00'
    MoneyInput:
      type: string
      description: INR amount with at most 10 integer digits and 2 decimals.
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      example: '1200.00'
    ErrorResponse:
      type: object
      description: The single error body of the API (CLAUDE.md 11.4).
      required: [code, message, details, traceId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable message that says what to fix.
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Optional structured data, e.g. `fields` (field -> message), `lines` (per-line receipt errors) or `claimIds`.'
        traceId:
          type: string
          example: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_CURRENT_APPROVER
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - STATE_CONFLICT
        - FILE_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
        - RECEIPT_REQUIRED
        - CLAIM_HAS_NO_LINES
        - COMMENT_REQUIRED
        - SELF_APPROVAL_FORBIDDEN
        - INVALID_DELEGATE
        - DELEGATION_OVERLAP
        - CLAIM_NOT_ELIGIBLE_FOR_PAYOUT
        - IDEMPOTENCY_KEY_REUSED
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMITED
        - INTERNAL_ERROR
    ClaimStatus:
      type: string
      description: Claim state (architecture/SPEC.md 3.1). `SUBMITTED` and `AUTO_APPROVED` are transient and appear only in the audit trail.
      enum: [DRAFT, SUBMITTED, AUTO_APPROVED, AUTO_REJECTED, PENDING_MANAGER, PENDING_AUDITOR, PENDING_FINANCE_HEAD, SENT_BACK, REJECTED, SAMPLE_AUDIT_PENDING, APPROVED, IN_PAYOUT_BATCH, PAID]
    ExpenseCategory:
      type: string
      enum: [MEALS, HOTEL, LOCAL_CAB]
    UserRole:
      type: string
      enum: [EMPLOYEE, FINANCE_AUDITOR, FINANCE_HEAD, ADMIN]
    StepType:
      type: string
      enum: [MANAGER, FINANCE_AUDITOR, FINANCE_HEAD]
    StepStatus:
      type: string
      enum: [WAITING, PENDING, APPROVED, REJECTED, SENT_BACK, SKIPPED, SUPERSEDED]
    PolicyResultType:
      type: string
      description: Stored policy result types. `VALIDATION` (POL-005) blocks submit and is never stored.
      enum: [LIMIT_BREACH, DUPLICATE_FLAG, WEEKEND_FLAG]
    AuditAction:
      type: string
      enum: [CLAIM_CREATED, LINE_ADDED, LINE_UPDATED, LINE_DELETED, RECEIPT_UPLOADED, CLAIM_SUBMITTED, POLICY_EVALUATED, CLAIM_AUTO_REJECTED, CLAIM_ROUTED, CLAIM_AUTO_APPROVED, SAMPLE_AUDIT_SELECTED, SAMPLE_AUDIT_NOT_SELECTED, STEP_ACTIVATED, STEP_SKIPPED, STEP_APPROVED, CLAIM_APPROVED, CLAIM_REJECTED, CLAIM_SENT_BACK, COMMENT_ADDED, DELEGATION_CREATED, DELEGATION_CANCELLED, PAYOUT_BATCH_CREATED, CLAIM_ADDED_TO_BATCH, PAYOUT_BATCH_EXPORTED, CLAIM_PAID, POLICY_RULE_CHANGED, LOGIN_SUCCEEDED, LOGIN_FAILED]
    EntityType:
      type: string
      enum: [CLAIM, LINE_ITEM, DELEGATION, PAYOUT_BATCH, POLICY_RULE, USER]
    AllowedAction:
      type: string
      enum: [EDIT, SUBMIT, APPROVE, REJECT, SEND_BACK, COMMENT]
    PayoutBatchStatus:
      type: string
      enum: [CREATED, EXPORTED]
    RuleKey:
      type: string
      enum:
        - meals.max_per_day
        - hotel.max_per_night.tier1
        - hotel.tier1_cities
        - hotel.max_per_night.other
        - local_cab.max_per_trip
        - receipt.mandatory_above
        - duplicate.match_fields
        - duplicate.match_receipt_hash
        - weekend.flag_for_manager
        - duplicate.match_date_receipt_no
        - approval.auditor_threshold
        - approval.finance_head_threshold
        - sample_audit.rate

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of items across all pages.

    HealthResponse:
      type: object
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          enum: [UP]
        database:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 200
          format: password
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          description: JWT to send as `Authorization Bearer`.
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
    Me:
      type: object
      required: [userId, employeeCode, name, email, role, departmentId, departmentName, managerId, isManager, isApprover, canDelegate, isAdmin]
      properties:
        userId:
          type: string
          format: uuid
        employeeCode:
          type: string
          example: EMP0142
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        departmentId:
          type: string
          format: uuid
        departmentName:
          type: string
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        isManager:
          type: boolean
          description: At least one user reports to this user.
        isApprover:
          type: boolean
          description: Manager, finance auditor, finance head, or an active delegate.
        canDelegate:
          type: boolean
          description: Same as isManager.
        isAdmin:
          type: boolean
          description: Role FINANCE_HEAD or ADMIN.
    Department:
      type: object
      required: [departmentId, name]
      properties:
        departmentId:
          type: string
          format: uuid
        name:
          type: string
    ClientConfig:
      type: object
      required: [receiptMandatoryAbove, tier1Cities, categories, allowedReceiptTypes, maxReceiptBytes, configVersion]
      properties:
        receiptMandatoryAbove:
          $ref: '#/components/schemas/Money'
        tier1Cities:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseCategory'
        allowedReceiptTypes:
          type: array
          items:
            type: string
            enum: [application/pdf, image/jpeg, image/png]
        maxReceiptBytes:
          type: integer
          example: 5242880
        configVersion:
          type: integer

    PersonRef:
      type: object
      required: [userId, name, employeeCode]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        employeeCode:
          type: string
          example: EMP0142
    NullablePersonRef:
      type: object
      nullable: true
      description: PersonRef, or null when not applicable.
      required: [userId, name, employeeCode]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        employeeCode:
          type: string
          example: EMP0142

    LineItemRequest:
      type: object
      additionalProperties: false
      description: |
        Line-item fields (architecture/SPEC.md 4.4, CL-05, CL-08). Hotel lines require `city`, `checkInDate`
        and `checkOutDate` (after check-in) and `expenseDate` equal to `checkInDate`; other categories must
        omit those three fields. `expenseDate` must not be in the future (IST).
      required: [category, amount, expenseDate, vendor, receiptNumber]
      properties:
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          allOf:
            - $ref: '#/components/schemas/MoneyInput'
          description: Greater than 0, at most 2 decimals.
        expenseDate:
          type: string
          format: date
        vendor:
          type: string
          minLength: 1
          maxLength: 120
        receiptNumber:
          type: string
          minLength: 1
          maxLength: 60
          description: Required on every line; date + receipt number must be unique (POL-009).
        city:
          type: string
          maxLength: 100
          nullable: true
          description: Hotel lines only.
        checkInDate:
          type: string
          format: date
          nullable: true
          description: Hotel lines only.
        checkOutDate:
          type: string
          format: date
          nullable: true
          description: Hotel lines only.
    ReceiptUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PDF, JPEG or PNG (checked by content), at most 5 MB.
    ReceiptView:
      type: object
      description: Receipt metadata; the SHA-256 is never returned.
      required: [receiptId, contentType, sizeBytes, uploadedAt]
      properties:
        receiptId:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        uploadedAt:
          type: string
          format: date-time
          nullable: true
    NullableReceiptView:
      type: object
      nullable: true
      description: ReceiptView, or null when the line has no receipt.
      required: [receiptId, contentType, sizeBytes, uploadedAt]
      properties:
        receiptId:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        uploadedAt:
          type: string
          format: date-time
          nullable: true
    PolicyResultView:
      type: object
      description: One fired rule on one line, from the claim's latest submission.
      required: [ruleId, resultType, configKey, configuredLimit, actualValue, reason, details]
      properties:
        ruleId:
          type: string
          pattern: '^POL-\d{3}$'
          example: POL-001
        resultType:
          $ref: '#/components/schemas/PolicyResultType'
        configKey:
          type: string
          nullable: true
        configuredLimit:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'
          description: Money; set for LIMIT_BREACH (hotel - per-night limit x nights), otherwise null.
        actualValue:
          type: string
          nullable: true
        reason:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
    LineItemView:
      type: object
      required: [lineItemId, lineNo, category, amount, expenseDate, vendor, receiptNumber, city, checkInDate, checkOutDate, nights, receipt, policyResults]
      properties:
        lineItemId:
          type: string
          format: uuid
        lineNo:
          type: integer
          minimum: 1
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          $ref: '#/components/schemas/Money'
        expenseDate:
          type: string
          format: date
        vendor:
          type: string
        receiptNumber:
          type: string
        city:
          type: string
          nullable: true
        checkInDate:
          type: string
          format: date
          nullable: true
        checkOutDate:
          type: string
          format: date
          nullable: true
        nights:
          type: integer
          nullable: true
          description: checkOutDate - checkInDate, hotel lines only (ASM-005).
        receipt:
          $ref: '#/components/schemas/NullableReceiptView'
        policyResults:
          type: array
          items:
            $ref: '#/components/schemas/PolicyResultView'
    StepView:
      type: object
      required: [stepId, submissionNo, level, stepType, status, assignedApprover, skipReason, actedBy, onBehalfOf, activatedAt, actedAt]
      properties:
        stepId:
          type: string
          format: uuid
        submissionNo:
          type: integer
          minimum: 1
        level:
          type: integer
          description: Order of the step in the chain.
        stepType:
          $ref: '#/components/schemas/StepType'
        status:
          $ref: '#/components/schemas/StepStatus'
        assignedApprover:
          allOf:
            - $ref: '#/components/schemas/NullablePersonRef'
          description: Manager steps only; pool steps (auditor, finance head) are null.
        skipReason:
          type: string
          nullable: true
          enum: [NO_APPROVER, CLAIMANT_IS_APPROVER, null]
          description: Set when status is SKIPPED (CL-09, ASM-009).
        actedBy:
          $ref: '#/components/schemas/NullablePersonRef'
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/NullablePersonRef'
          description: The delegator when a delegate acted.
        activatedAt:
          type: string
          format: date-time
          nullable: true
        actedAt:
          type: string
          format: date-time
          nullable: true
    CommentView:
      type: object
      required: [commentId, author, body, createdAt]
      properties:
        commentId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/NullablePersonRef'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
    ClaimSummary:
      type: object
      required: [claimId, claimNumber, status, total, createdAt, submittedAt, decidedAt, lineCount]
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
          pattern: '^CLM-\d{4}-\d{5}$'
          example: CLM-2026-01534
        status:
          $ref: '#/components/schemas/ClaimStatus'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        lineCount:
          type: integer
          minimum: 0
    ClaimDetail:
      type: object
      required: [claimId, claimNumber, status, total, claimant, department, createdAt, updatedAt, submittedAt, decidedAt, submissionNo, configVersion, decisionReason, latestSendBackComment, lineItems, steps, comments, allowedActions]
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
          pattern: '^CLM-\d{4}-\d{5}$'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        total:
          $ref: '#/components/schemas/Money'
        claimant:
          $ref: '#/components/schemas/NullablePersonRef'
        department:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        submissionNo:
          type: integer
          minimum: 0
          description: 0 until first submitted; +1 per resubmission (CL-12).
        configVersion:
          type: integer
          nullable: true
          description: Policy config version stored at submit (B-08).
        decisionReason:
          type: string
          nullable: true
          description: Auto-reject reasons or the rejection comment of the latest submission.
        latestSendBackComment:
          type: string
          nullable: true
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemView'
        steps:
          type: array
          description: Steps of every submission, including SUPERSEDED ones.
          items:
            $ref: '#/components/schemas/StepView'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentView'
        allowedActions:
          type: array
          description: Actions the caller may take now; the backend still checks each one.
          items:
            $ref: '#/components/schemas/AllowedAction'
    ClaimSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClaimSummary'

    AuditEventView:
      type: object
      required: [eventId, occurredAt, action, actor, onBehalfOf, entityType, entityId, claimId, claimNumber, fromState, toState, comment, details]
      properties:
        eventId:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/AuditAction'
        actor:
          allOf:
            - $ref: '#/components/schemas/NullablePersonRef'
          description: Null for system actions and failed logins.
        onBehalfOf:
          $ref: '#/components/schemas/NullablePersonRef'
        entityType:
          $ref: '#/components/schemas/EntityType'
        entityId:
          type: string
          format: uuid
          nullable: true
        claimId:
          type: string
          format: uuid
          nullable: true
        claimNumber:
          type: string
          nullable: true
        fromState:
          type: string
          nullable: true
          description: A ClaimStatus value, or null.
          example: SUBMITTED
        toState:
          type: string
          nullable: true
          description: A ClaimStatus value, or null.
          example: PENDING_MANAGER
        comment:
          type: string
          nullable: true
        details:
          description: Free-form JSON recorded with the event (e.g. evaluation summary, sample draw, old/new config value).
    AuditEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEventView'

    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional comment.
    DecisionRequest:
      type: object
      additionalProperties: false
      description: The body is optional for the parser, but a non-blank comment is mandatory (`422 COMMENT_REQUIRED`).
      properties:
        comment:
          type: string
          maxLength: 2000
          nullable: true
    CommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Must not be blank.
    ApprovalItem:
      type: object
      required: [claimId, claimNumber, status, total, claimant, department, stepType, submittedAt, pendingSince, onBehalfOf, flags]
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        status:
          $ref: '#/components/schemas/ClaimStatus'
        total:
          $ref: '#/components/schemas/Money'
        claimant:
          $ref: '#/components/schemas/NullablePersonRef'
        department:
          type: string
          nullable: true
        stepType:
          type: string
          enum: [MANAGER, FINANCE_HEAD]
        submittedAt:
          type: string
          format: date-time
          nullable: true
        pendingSince:
          type: string
          format: date-time
          nullable: true
        onBehalfOf:
          allOf:
            - $ref: '#/components/schemas/NullablePersonRef'
          description: The delegator, when the caller sees this as a delegate.
        flags:
          type: array
          items:
            type: string
            enum: [DUPLICATE, WEEKEND]
    ApprovalItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalItem'

    CreateDelegationRequest:
      type: object
      additionalProperties: false
      required: [delegateId, startDate, endDate]
      properties:
        delegateId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: First day of leave (inclusive, IST).
        endDate:
          type: string
          format: date
          description: Last day of leave (inclusive, IST); not before startDate.
    DelegationView:
      type: object
      required: [delegationId, direction, delegator, delegate, startDate, endDate, cancelledAt, active, createdAt]
      properties:
        delegationId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [GIVEN, RECEIVED]
        delegator:
          $ref: '#/components/schemas/NullablePersonRef'
        delegate:
          $ref: '#/components/schemas/NullablePersonRef'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          description: Not cancelled and today (IST) is within the dates.
        createdAt:
          type: string
          format: date-time
          nullable: true
    DelegationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DelegationView'

    QueueItem:
      type: object
      required: [claimId, claimNumber, status, queue, total, claimant, department, categories, flags, submittedAt, waitingSince]
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        status:
          type: string
          enum: [PENDING_AUDITOR, SAMPLE_AUDIT_PENDING]
        queue:
          type: string
          enum: [AUDITOR_STEP, SAMPLE_AUDIT]
        total:
          $ref: '#/components/schemas/Money'
        claimant:
          $ref: '#/components/schemas/NullablePersonRef'
        department:
          type: string
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseCategory'
        flags:
          type: array
          items:
            type: string
            enum: [DUPLICATE, WEEKEND]
        submittedAt:
          type: string
          format: date-time
          nullable: true
        waitingSince:
          type: string
          format: date-time
          nullable: true
          description: Auditor step activation time, or sample-audit selection time.
    QueueItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QueueItem'
    BulkApproveRequest:
      type: object
      additionalProperties: false
      required: [claimIds]
      properties:
        claimIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    BulkItem:
      type: object
      required: [claimId, outcome, code, message]
      properties:
        claimId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [APPROVED, FAILED]
        code:
          type: string
          nullable: true
          description: ErrorCode of a FAILED item; null when APPROVED.
        message:
          type: string
          nullable: true
    BulkResult:
      type: object
      required: [results, approved, failed]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkItem'
        approved:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0

    BatchSummary:
      type: object
      required: [batchId, batchNumber, status, claimCount, totalAmount, createdAt, createdBy, exportedAt, exportedBy, fileName, fileSha256]
      properties:
        batchId:
          type: string
          format: uuid
        batchNumber:
          type: string
          pattern: '^PB-\d{4}-\d{4}$'
          example: PB-2026-0007
        status:
          $ref: '#/components/schemas/PayoutBatchStatus'
        claimCount:
          type: integer
          minimum: 0
        totalAmount:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
        exportedAt:
          type: string
          format: date-time
          nullable: true
        exportedBy:
          type: string
          format: uuid
          nullable: true
        fileName:
          type: string
          nullable: true
          description: Set after export.
        fileSha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
    BatchSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BatchSummary'
    PayoutClaim:
      type: object
      required: [claimId, claimNumber, status, total, claimant, department, approvedAt]
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        status:
          type: string
          enum: [APPROVED, IN_PAYOUT_BATCH, PAID]
        total:
          $ref: '#/components/schemas/Money'
        claimant:
          $ref: '#/components/schemas/NullablePersonRef'
        department:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
    PayoutClaimPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PayoutClaim'
    BatchDetail:
      type: object
      required: [batch, claims]
      properties:
        batch:
          $ref: '#/components/schemas/BatchSummary'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/PayoutClaim'
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [claimIds]
      properties:
        claimIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    ExportSummary:
      type: object
      description: Control summary of the exported file (CLAUDE.md 2.8).
      required: [batchId, batchNumber, fileName, rowCount, totalAmount, fileSha256, exportedAt]
      properties:
        batchId:
          type: string
          format: uuid
        batchNumber:
          type: string
        fileName:
          type: string
          pattern: '^EXPENSEFLOW_PAYOUT_PB-\d{4}-\d{4}_\d{8}\.csv$'
        rowCount:
          type: integer
          minimum: 1
        totalAmount:
          $ref: '#/components/schemas/Money'
        fileSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        exportedAt:
          type: string
          format: date-time

    SpendItem:
      type: object
      required: [key, total, lineCount]
      properties:
        key:
          type: string
          description: Category, department name or month `YYYY-MM`.
        total:
          $ref: '#/components/schemas/Money'
        lineCount:
          type: integer
          minimum: 0
    SpendReport:
      type: object
      required: [groupBy, items, grandTotal]
      properties:
        groupBy:
          type: string
          enum: [category, department, month]
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpendItem'
        grandTotal:
          $ref: '#/components/schemas/Money'
    ViolationItem:
      type: object
      required: [ruleId, resultType, count, claimCount]
      properties:
        ruleId:
          type: string
          example: POL-001
        resultType:
          $ref: '#/components/schemas/PolicyResultType'
        count:
          type: integer
          minimum: 0
        claimCount:
          type: integer
          minimum: 0
    ViolationReport:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ViolationItem'
        total:
          type: integer
          minimum: 0
    ApprovalTimeReport:
      type: object
      required: [approvedClaims, averageHours, routedClaims, averageHoursRouted]
      properties:
        approvedClaims:
          type: integer
          format: int64
          minimum: 0
        averageHours:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'
          description: Average hours, two decimals; null when no claim matches.
        routedClaims:
          type: integer
          format: int64
          minimum: 0
        averageHoursRouted:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'

    RuleView:
      type: object
      required: [ruleKey, value, configVersion, updatedBy, updatedAt]
      properties:
        ruleKey:
          $ref: '#/components/schemas/RuleKey'
        value:
          description: Money keys and `sample_audit.rate` are decimal strings; flags are booleans; `hotel.tier1_cities` and `duplicate.match_fields` are string arrays.
        configVersion:
          type: integer
          minimum: 1
        updatedBy:
          type: string
          format: uuid
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    UpdateRuleRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          description: New value; its type depends on the key (see API-035).
