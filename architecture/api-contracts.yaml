    put:
      operationId: updatePolicyRule
      summary: Change one policy configuration value
      description: |
        Finance head or admin only (CL-10). Inserts a new row with the next `configVersion`; claims already
        submitted keep the version they stored (B-08). Value rules: money keys are amounts with at most
        2 decimals (`> 0`; `receipt.mandatory_above` `>= 0`), sent as a JSON number or numeric string, and the
        finance-head threshold must stay above the auditor threshold; `sample_audit.rate` is `> 0` and `<= 1`;
        `duplicate.match_receipt_hash`, `weekend.flag_for_manager`, `duplicate.match_date_receipt_no` are
        booleans; `hotel.tier1_cities` is a non-empty list of names (max 100 characters each);
        `duplicate.match_fields` is a non-empty subset of `vendor`, `amount`, `expenseDate`. Invalid values
        are `400` with `details.fields.value`. Audit `POLICY_RULE_CHANGED` with old and new value.
