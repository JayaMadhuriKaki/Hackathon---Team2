        otherwise `422 CLAIM_NOT_ELIGIBLE_FOR_PAYOUT` with `details.claimIds` (B-09). Sampled claims are not
        `APPROVED` until reviewed (CL-14). The batch is `CREATED`; claims move to `IN_PAYOUT_BATCH` (T-14).
        Audit `PAYOUT_BATCH_CREATED` and `CLAIM_ADDED_TO_BATCH`.
      tags: [Payouts]
