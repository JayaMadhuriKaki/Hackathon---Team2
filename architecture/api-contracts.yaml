openapi: 3.0.3
info:
  title: "<Project Name> API"
  version: 0.1.0
  description: |
    Contract-first API for the hackathon project.
    Conventions: base path /api/v1, camelCase JSON, ISO-8601 UTC dates,
    standard Error shape, page/pageSize pagination.
    Each operation carries x-api-id (API-###) and x-requirements (FR/NFR IDs).
  contact:
    name: "<Team name>"
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: https://<demo-host>/api/v1
    description: Demo

tags:
  - name: Health
  - name: Auth
  - name: Items
    description: "Placeholder resource — rename to your main domain entity"

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health check
      x-api-id: API-001
      x-requirements: [NFR-006]
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 0.1.0 }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive an access token
      x-api-id: API-002
      x-requirements: [NFR-002]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /items:
    get:
      tags: [Items]
      operationId: listItems
      summary: List items (paginated)
      x-api-id: API-003
      x-requirements: [FR-001]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { type: string, enum: [active, archived] }
        - name: sort
          in: query
          description: Field to sort by; prefix with - for descending
          schema: { type: string, example: -createdAt }
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Items]
      operationId: createItem
      summary: Create an item
      x-api-id: API-004
      x-requirements: [FR-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [Items]
      operationId: getItem
      summary: Get one item
      x-api-id: API-005
      x-requirements: [FR-001]
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Items]
      operationId: updateItem
      summary: Partially update an item
      x-api-id: API-006
      x-requirements: [FR-003]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Items]
      operationId: deleteItem
      summary: Delete an item
      x-api-id: API-007
      x-requirements: [FR-004]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: demo@example.com }
        password: { type: string, format: password, example: Demo@123 }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 3600 }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [user, admin] }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Sample item }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ItemCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
    ItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [active, archived] }
    ItemPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: name is required }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
