          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT from API-002 (`sub` = user ID, `role`, `exp`). Lifetime 480 minutes by default (SPEC-Q-13).

  headers:
    XTraceId:
      description: Request trace ID; also in logs, audit rows and error bodies.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
      example: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21

  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      description: Claim ID
      schema:
        type: string
        format: uuid
    LineItemId:
      name: lineItemId
      in: path
      required: true
      description: Line item ID (must belong to the claim)
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      description: Payout batch ID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated key (1-100 characters). Same key and same request replays the stored
        response; same key and a different request is `422 IDEMPOTENCY_KEY_REUSED`; a duplicate while the
        first is running is `409`. Kept 24 hours, per user and operation.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: 6a1f0c3e-2b7d-4e8a-9c5f-1d2e3f4a5b6c
    FromDate:
      name: fromDate
      in: query
      required: false
      description: Expense date on or after (inclusive).
      schema:
        type: string
        format: date
    ToDate:
      name: toDate
      in: query
      required: false
      description: Expense date on or before (inclusive).
      schema:
        type: string
        format: date
    DepartmentId:
      name: departmentId
      in: query
      required: false
      description: Only claimants in this department.
      schema:
        type: string
        format: uuid

  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED` - malformed body, unknown JSON field, wrong parameter type, bad paging or a field rule (`details.fields`)'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_FAILED
            message: One or more fields are invalid
            details:
              fields:
                amount: must be greater than 0
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    Unauthenticated:
      description: '`UNAUTHENTICATED` - missing, invalid or expired access token'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHENTICATED
            message: 'Sign in to continue: the access token is missing, invalid or expired'
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    Forbidden:
      description: '`FORBIDDEN` - the caller''s role or capability does not allow this operation'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Only the finance head or an admin can manage payouts
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    NotClaimant:
      description: '`FORBIDDEN` - the claim is visible to the caller (e.g. an approver) but only the claimant may change or submit it'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Only the claimant can change this claim
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    NotCurrentApprover:
      description: '`NOT_CURRENT_APPROVER` - the claim is visible but the caller cannot act on its current step'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_CURRENT_APPROVER
            message: You are not the approver of the current step
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    NotFound:
      description: '`NOT_FOUND` - does not exist or is not visible to the caller (CL-15, B-10)'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Claim not found
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    StateConflict:
      description: '`STATE_CONFLICT` - not allowed from the current state, or the same idempotent request is still running'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: STATE_CONFLICT
            message: The claim is APPROVED and cannot take this action
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    FileTooLarge:
      description: '`FILE_TOO_LARGE` - the receipt is above 5 MB'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FILE_TOO_LARGE
            message: The uploaded file is too large
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    UnsupportedFileType:
      description: '`UNSUPPORTED_FILE_TYPE` - the file content is not PDF, JPEG or PNG, or the request is not multipart'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNSUPPORTED_FILE_TYPE
            message: Receipts must be PDF, JPEG or PNG files
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    RateLimited:
      description: '`RATE_LIMITED` - too many requests in the current one-minute window'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Too many requests. Wait a minute and try again.
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
    InternalError:
      description: '`INTERNAL_ERROR` - unexpected failure; no stack trace is returned'
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Something went wrong. Quote the trace ID if you report it.
            details: null
            traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21

