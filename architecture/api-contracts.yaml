openapi: 3.0.3
info:
  title: ExpenseFlow API
  version: 1.0.0
  description: |
    Contract for the ExpenseFlow backend (Spring Boot 4.1, JDK 21) - expense claims and
    policy-driven approvals. This document describes the API **as implemented** in
    `backend/src/main/java/com/hackathon/backend/controller/`. Operation IDs, roles and
    requirement IDs come from `architecture/SPEC.md` section 7 and `backend/SPEC.md` section 6.

    **Conventions (architecture/SPEC.md section 8)**
    - Base path `/api/v1`. JSON fields are camelCase.
    - Authentication: `Authorization: Bearer <JWT>` (HS256, 8 h by default) on every operation
      except API-001 and API-002.
    - **Money** in JSON is a string with exactly two decimals, e.g. `"27450.00"` (INR). Request
      amounts are strings with at most two decimals. Never floating point.
    - Dates are `YYYY-MM-DD`; timestamps are ISO-8601 UTC. "Today" and date filters on
      timestamps use IST (ASM-002).
    - Lists use `page` (1-based, default 1), `pageSize` (1-100, default 20) and, where
      supported, `sort` (`field` or `-field`). List responses are `{items, page, pageSize, total}`.
    - **Unknown JSON fields are rejected** with `400 VALIDATION_FAILED` (mass-assignment guard).
    - Every response carries an `X-Trace-Id` header. A safe inbound `X-Trace-Id`
      (`^[A-Za-z0-9-]{8,64}$`) is reused, otherwise a UUID is generated.
    - Every error uses `ErrorResponse` `{code, message, details, traceId}`; no stack traces.
      A JSON body sent with an unsupported `Content-Type` returns `415 UNSUPPORTED_FILE_TYPE`;
      an unsupported HTTP method returns `405 METHOD_NOT_ALLOWED`; an unexpected failure
      returns `500 INTERNAL_ERROR`.
    - **Idempotency** (API-012, 015, 016, 017, 023, 026, 028): optional `Idempotency-Key`
      header. Same key + same request replays the stored response; same key + different
      request is `422 IDEMPOTENCY_KEY_REUSED`; a duplicate that arrives while the first is
      still running is `409 STATE_CONFLICT`. Keys are kept 24 hours.
    - Visibility (CL-15, ASM-008): a claim that exists but is not visible to the caller is
      reported as `404 NOT_FOUND`, never 403 (B-10).

    **Vendor extensions**: `x-api-id` (API-###), `x-requirements` (FR/NFR/POL/CL/ASM IDs),
    `x-roles` (roles from `UserRole` or derived capabilities: `ANY` = any signed-in user,
    `PUBLIC`, `CLAIMANT`, `CURRENT_STEP_APPROVER`, `MANAGER` = `canDelegate`,
    `ADMIN_CAPABILITY` = role `FINANCE_HEAD` or `ADMIN`), `x-rate-limit`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker Compose backend (used by Swagger UI "Try it out" on :8082)
  - url: /api/v1
    description: Relative to the host serving the backend (frontend nginx or Vite proxy)

tags:
  - name: Platform
    description: Health check (API-001)
  - name: Auth
    description: Login and the signed-in user (API-002, API-003)
  - name: Reference
    description: Reference data for forms and filters (API-036, API-037)
  - name: Claims
    description: Claims, line items, receipts, submit and claim audit history (API-004 to API-013)
  - name: Approvals
    description: Approver queue and approver actions (API-014 to API-018)
  - name: Delegations
    description: Delegation while on leave (API-019 to API-021, API-038)
  - name: Review Queue
    description: Finance auditor review queue and bulk approve (API-022, API-023)
  - name: Payouts
    description: Payout batches and the bank-file export (API-024 to API-029)
  - name: Dashboard
    description: Aggregate figures for finance auditors and admins (API-030 to API-032)
  - name: Audit
    description: Full append-only audit trail (API-033)
  - name: Policy
    description: Policy as configuration (API-034, API-035)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Application and database health
      description: Public app-level health used by the frontend status card. Always 200; `database` reports `UP` or `DOWN`.
      tags: [Platform]
      x-api-id: API-001
      x-requirements: [NFR-006]
      x-roles: [PUBLIC]
      security: []
      responses:
        '200':
          description: Health status
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                database: UP
                timestamp: '2026-11-27T09:30:00Z'

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        Seeded synthetic users sign in with email and password (Q-22, SPEC-Q-07 proposed) and receive
        a bearer JWT. Every attempt is audited (`LOGIN_SUCCEEDED` / `LOGIN_FAILED`) without the password.
        Rate-limited per client IP (all attempts count). A wrong email and a wrong password give the
        same `401` response.
      tags: [Auth]
      x-api-id: API-002
      x-requirements: [Q-22, SPEC-Q-07, SPEC-Q-13]
      x-roles: [PUBLIC]
      x-rate-limit:
        limit: 5
        window: 1m
        scope: client IP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ananya.rao@expenseflow.example
              password: demo-password
      responses:
        '200':
          description: Signed in
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMTkzN2MyYSJ9.c2lnbmF0dXJl
                tokenType: Bearer
                expiresAt: '2026-11-27T17:30:00Z'
                user:
                  userId: 01937c2a-1000-7000-8000-000000000142
                  employeeCode: EMP0142
                  name: Ananya Rao
                  email: ananya.rao@expenseflow.example
                  role: EMPLOYEE
                  departmentId: 01937c2a-0000-7000-8000-000000000001
                  departmentName: Consulting
                  managerId: 01937c2a-1000-7000-8000-000000000017
                  isManager: false
                  isApprover: false
                  canDelegate: false
                  isAdmin: false
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Email or password is incorrect (`UNAUTHENTICATED`)
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHENTICATED
                message: Email or password is incorrect
                details: null
                traceId: 3f1c2b9e-7d4a-4c1e-9b2f-0a6d8e5c4b21
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      summary: The signed-in user and derived capabilities
      description: Returns the user profile and capabilities (`isManager`, `isApprover`, `canDelegate`, `isAdmin`) so the UI never guesses (architecture/SPEC.md section 2).
      tags: [Auth]
      x-api-id: API-003
      x-requirements: [CL-10, CL-13, CL-15]
      x-roles: [ANY]
      responses:
        '200':
          description: Current user
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                employee:
                  $ref: '#/components/examples/MeExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /departments:
    get:
      operationId: listDepartments
      summary: List departments
      description: All departments ordered by name, for review-queue and dashboard filters.
      tags: [Reference]
      x-api-id: API-036
      x-requirements: [FR-009, FR-015, DATA-001]
      x-roles: [ANY]
      responses:
        '200':
          description: Departments
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
              example:
                - departmentId: 01937c2a-0000-7000-8000-000000000001
                  name: Consulting
                - departmentId: 01937c2a-0000-7000-8000-000000000002
                  name: Finance
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /policy-rules/client-config:
    get:
      operationId: getClientConfig
      summary: Policy values needed for client-side validation
      description: Active receipt threshold, tier-1 cities, categories, allowed receipt types and maximum receipt size. Client validation is for user experience only; the backend re-checks everything.
      tags: [Reference]
      x-api-id: API-037
      x-requirements: [POL-005, CL-08, NFR-001]
      x-roles: [ANY]
      responses:
        '200':
          description: Client configuration
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
              example:
                receiptMandatoryAbove: '500.00'
                tier1Cities: [Kolkata, Mumbai, Delhi, Chennai, Bangalore]
                categories: [MEALS, HOTEL, LOCAL_CAB]
                allowedReceiptTypes: [application/pdf, image/jpeg, image/png]
                maxReceiptBytes: 5242880
                configVersion: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /claims:
    get:
      operationId: listMyClaims
      summary: List the caller's own claims
      description: Only claims where the caller is the claimant, whatever the caller's role (FR-019, CL-15). Default sort `-createdAt`.
      tags: [Claims]
      x-api-id: API-004
      x-requirements: [FR-019, CL-15, NFR-005]
      x-roles: [ANY]
      parameters:
        - name: status
          in: query
          required: false
          description: Only claims in this state.
          schema:
            $ref: '#/components/schemas/ClaimStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          required: false
          description: Sort field, `-` prefix for descending. Default `-createdAt`.
          schema:
            type: string
            enum: [createdAt, -createdAt, submittedAt, -submittedAt, totalAmount, -totalAmount, claimNumber, -claimNumber, status, -status]
      responses:
        '200':
          description: A page of the caller's claims
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimSummaryPage'
              example:
                items:
                  - claimId: 01937c2a-5b1e-7c3d-9a4f-2b6e8d1c0a11
                    claimNumber: CLM-2026-01534
                    status: PENDING_MANAGER
                    total: '27450.00'
                    createdAt: '2026-11-25T04:10:00Z'
                    submittedAt: '2026-11-25T05:00:00Z'
                    decidedAt: null
                    lineCount: 3
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createClaim
      summary: Create a draft claim
      description: Creates an empty `DRAFT` claim owned by the caller and assigns its `claimNumber` (T-01, audit `CLAIM_CREATED`). No request body is read.
      tags: [Claims]
      x-api-id: API-005
      x-requirements: [FR-001, FR-002]
      x-roles: [ANY]
      responses:
        '201':
          description: Draft created
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetail'
              examples:
                draft:
                  $ref: '#/components/examples/ClaimDetailDraftExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      operationId: getClaim
      summary: Get a claim with lines, policy results, steps, comments and allowed actions
      description: |
        Visible to the claimant; to whoever may act on the current `PENDING` step (incl. active delegates
        and pool-role holders, never the claimant); to finance auditors for a `SAMPLE_AUDIT_PENDING`
        claim that is not theirs; and to anyone who has acted on the claim. Otherwise `404`
        (CL-15, ASM-008, B-10). Receipt hashes are never returned.
      tags: [Claims]
      x-api-id: API-006
      x-requirements: [FR-019, CL-15, ASM-008, NFR-002, NFR-005]
      x-roles: [CLAIMANT, CURRENT_STEP_APPROVER, FINANCE_AUDITOR]
      responses:
        '200':
          description: Claim detail
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetail'
              examples:
                pendingManager:
                  $ref: '#/components/examples/ClaimDetailPendingExample'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /claims/{claimId}/line-items:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: addLineItem
      summary: Add a line item to a draft or sent-back claim
      description: |
        Claimant only, while the claim is `DRAFT` or `SENT_BACK` (B-04). Field rules (architecture/SPEC.md 4.4):
        `expenseDate` not in the future (IST); hotel lines need `city`, `checkInDate`, `checkOutDate`
        (check-out after check-in) and `expenseDate` = `checkInDate` (ASM-005, ASM-S-03); non-hotel lines
        must not send `city` or stay dates. The claim total is recomputed. Audit `LINE_ADDED`.
      tags: [Claims]
      x-api-id: API-007
      x-requirements: [FR-001, FR-002, CL-05, CL-08, ASM-005]
      x-roles: [CLAIMANT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineItemRequest'
            examples:
              hotel:
                $ref: '#/components/examples/HotelLineRequestExample'
              meal:
                summary: Meal line
                value:
                  category: MEALS
                  amount: '1200.00'
                  expenseDate: '2026-11-24'
                  vendor: Saravana Bhavan
                  receiptNumber: SB-88231
      responses:
        '201':
          description: Line added
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemView'
              examples:
                hotel:
                  $ref: '#/components/examples/HotelLineViewExample'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotClaimant'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /claims/{claimId}/line-items/{lineItemId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/LineItemId'
    put:
      operationId: updateLineItem
      summary: Replace a line item
      description: Same rules as API-007; the line must belong to the claim. Audit `LINE_UPDATED`.
      tags: [Claims]
      x-api-id: API-008
      x-requirements: [FR-001, FR-002, CL-05, CL-08, ASM-005]
      x-roles: [CLAIMANT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineItemRequest'
            examples:
              hotel:
                $ref: '#/components/examples/HotelLineRequestExample'
      responses:
        '200':
          description: Line updated
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemView'
              examples:
                hotel:
                  $ref: '#/components/examples/HotelLineViewExample'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotClaimant'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteLineItem
      summary: Delete a line item
      description: Claimant only, `DRAFT` or `SENT_BACK`. The line's receipt is deleted too and the total recomputed. Audit `LINE_DELETED`.
      tags: [Claims]
      x-api-id: API-009
      x-requirements: [FR-001, FR-002]
      x-roles: [CLAIMANT]
      responses:
        '204':
          description: Line deleted
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotClaimant'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /claims/{claimId}/line-items/{lineItemId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/LineItemId'
    post:
      operationId: uploadReceipt
      summary: Upload (or replace) the receipt of a line item
      description: |
        Claimant only, `DRAFT` or `SENT_BACK`. One receipt per line; a new upload replaces the old one.
        The type is detected from the file content (magic bytes), not the name or header: PDF, JPEG or PNG
        only (`415`). Maximum 5 MB (`413`); an empty file is `400`. The SHA-256 is stored for POL-007 and
        never returned. Rate-limited per user. Audit `RECEIPT_UPLOADED`.
      tags: [Claims]
      x-api-id: API-010
      x-requirements: [FR-001, POL-005, POL-007, Q-21, SPEC-Q-06]
      x-roles: [CLAIMANT]
      x-rate-limit:
        limit: 30
        window: 1m
        scope: user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptUpload'
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        '201':
          description: Receipt stored
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptView'
              example:
                receiptId: 01937c2a-7a00-7000-8000-0000000000a1
                contentType: application/pdf
                sizeBytes: 184321
                uploadedAt: '2026-11-25T04:20:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotClaimant'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFileType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: downloadReceipt
      summary: Download a line item's receipt
      description: Served inline with `X-Content-Type-Options nosniff` and `Cache-Control private, no-store`, only to users who can view the claim (NFR-002). `404` if the claim is not visible, the line is not on the claim, or the line has no receipt.
      tags: [Claims]
      x-api-id: API-011
      x-requirements: [NFR-002, FR-019, CL-15]
      x-roles: [CLAIMANT, CURRENT_STEP_APPROVER, FINANCE_AUDITOR]
      responses:
        '200':
          description: The receipt file
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
            Content-Disposition:
              description: Inline, file name `receipt-<claimNumber>-line-<lineNo>.<pdf|png|jpg>`
              schema:
                type: string
              example: inline; filename="receipt-CLM-2026-01534-line-1.pdf"
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
            Cache-Control:
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /claims/{claimId}/submit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      operationId: submitClaim
      summary: Submit a claim and run the policy engine
      description: |
        Claimant only, from `DRAFT` or `SENT_BACK`. In one transaction (architecture/SPEC.md 3.3):
        checks at least one line (`422 CLAIM_HAS_NO_LINES`) and a receipt on every line above
        `receipt.mandatory_above` (`422 RECEIPT_REQUIRED`, `details.lines[]`), state unchanged on failure
        (ASM-003); on resubmission old steps become `SUPERSEDED` (CL-12); stores the config version; runs
        POL-001..POL-009; then auto-rejects (any limit breach, CL-07), routes to the approval chain
        (total above the auditor threshold, weekend or duplicate flag, or claimant is a finance head;
        CL-02, CL-03, CL-16, ASM-004) or auto-approves with a 10% sample-audit draw (FR-011, CL-14).
        The outcome is the returned `status`: `AUTO_REJECTED`, `PENDING_*`, `SAMPLE_AUDIT_PENDING` or `APPROVED`.
      tags: [Claims]
      x-api-id: API-012
      x-requirements: [FR-003, FR-004, FR-005, FR-011, POL-001, POL-002, POL-003, POL-004, POL-005, POL-006, POL-007, POL-008, POL-009, CL-02, CL-03, CL-07, CL-09, CL-12, CL-14, CL-16]
      x-roles: [CLAIMANT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted; the outcome is in `status`
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDetail'
              examples:
                routed:
                  $ref: '#/components/examples/ClaimDetailPendingExample'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotClaimant'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          description: '`CLAIM_HAS_NO_LINES`, `RECEIPT_REQUIRED` (per-line `details.lines`) or `IDEMPOTENCY_KEY_REUSED`'
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                receiptRequired:
                  summary: A line above 500 INR has no receipt
                  value:
                    code: RECEIPT_REQUIRED
                    message: Upload a receipt for every line above INR 500.00
                    details:
                      lines:
                        - lineItemId: 01937c2a-6c00-7000-8000-000000000101
                          code: RECEIPT_REQUIRED
