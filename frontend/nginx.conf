server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Receipts can be up to 5 MB (API-037 maxReceiptBytes); allow multipart overhead.
    client_max_body_size 6m;

    # Re-resolve "backend" through Docker's DNS, so a recreated backend container (new IP)
    # is found without restarting the frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward API calls to the backend container (same origin, no CORS).
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
