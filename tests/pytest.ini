[pytest]
# Black-box API suites (CLAUDE.md §16.3). Run from the repo root:  pytest tests -q
pythonpath = .
testpaths = backend integration
python_files = test_*.py
markers =
    tc(id): test-case ID in deliverables/test-cases.xlsx
    config_change: changes global policy configuration (restored afterwards); runs serially
    db: needs `docker compose exec postgres` access to check database permissions
addopts = -ra
